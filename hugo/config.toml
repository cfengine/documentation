baseurl = "/"
languageCode = "en"
# %branch% placeholder replaces with actual branch while generation
title = "CFEngine %branch% docs"
theme = "docs"
copyright = "&copy; 2025 <a href=\"https://northern.tech\">Northern.tech</a> AS"
enableRobotsTXT = true
publishDir = "../generator/_site"
relativeURLs = true

[params]
branch = "%branch%"
CFE_manuals_version = "%branch%"
repositoryUrl = "https://github.com/cfengine/documentation"
searchBaseUrl = "/docs/search/%branch%/"
searchUrlPrefix = ".."
domain = "docs.cfengine.com"
# Used as the summary line in llms.txt
description = "CFEngine %branch% documentation: installation, policy language reference, Masterfiles Policy Framework, Mission Portal and Enterprise API."
isLTS = false

[params.cfengine]
branch = "%branch%"
core_branch = "master"
latest_patch_release = 2
latest_package_build = "1a"
vagrant_package_build = 1
masterfiles_branch = "master"

# Number of posts per page
[pagination]
pagerSize = 10

[taxonomies]
tag = "tags"

[markup]
[markup.highlight]
style = 'pygments'
codeFences = true
pygmentsCodeFences = true
wrapperClass = 'hlc'

[markup.goldmark.renderer]
  unsafe = true # Allow HTML in md files

# Automatically convert bare URLs into clickable links
# linkify skips IP addresses, which are handled by
# generator/_scripts/cfdoc_ip_autolink.py pre-process script
[markup.goldmark.extensions]
  linkify = true

[params.sitemap]
baseUrl = "https://docs.cfengine.com/docs/%branch%"

[params.theme.colors]
  primary = "#15357f" # home page h1
  secondary = "#f5821f"
  link = "#1d71d3"
  footer = "#052569"

# llms.txt (https://llmstxt.org), see
# https://github.com/gethugothemes/hugo-modules/tree/main/llms-txt
# go.mod / go.sum come from nt-docs
[module]
[[module.imports]]
path = "github.com/gethugothemes/hugo-modules/llms-txt"

[outputs]
home = ["HTML", "RSS", "llms", "llmsfull", "md"]
section = ["HTML", "RSS", "md"]
page = ["HTML", "md"]

[params.llms]
generate_llms_txt = true
generate_llms_full_txt = true
include = []
exclude = ["/tags/**"]
